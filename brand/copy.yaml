  kicker: Engineering analysis, AI automation and agentic workflows | Houston, Texas
  heading: Engineering analysis that is practical, dependable and repeatable.
  lead: >-
    AI automation and agentic workflows are topics for discussion under a separately agreed scope.
  discuss: Contact us
  facts:
    - heading: Founded 2010
      detail: Houston, Texas
    - heading: 25+ years of experience
      detail: Principal engineer, offshore and marine
    - heading: Public, checked code
      detail: 35 of 196 modules pass their cited checks (catalogue run 2026-10-17)
  services_heading: Services
