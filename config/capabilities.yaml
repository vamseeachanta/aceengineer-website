# capabilities.yaml — registry of algorithm/data capabilities surfaced on aceengineer.com
#
# Single source of truth (SSOT) for the HF-backed capability pages. build.js reads
# this at build time, fetches each dataset from the Hugging Face datasets-server
# /rows API, and renders one indexable page per capability. Adding a new algorithm
# to the website = publish its HF dataset + add one entry here (CI enforces both).
#
# Epic: vamseeachanta/workspace-hub#3485 · C1: vamseeachanta/aceengineer-website#49
# Schema + how-to: docs/capabilities-registry.md
#
# Entry fields:
#   id             (required) stable kebab-case slug — becomes the page URL /capabilities/<id>.
#   title          (required) human-readable capability name (unique <title> for SEO).
#   domain         (required) one of: worldenergy | digitalmodel.
#   summary        (required) one-sentence description shown on the card + detail page.
#   hf_dataset     (required) Hugging Face dataset id, e.g. aceengineer/worldenergydata-explorer.
#   provenance_url (required) link to the source repo/report that produced the data.
#   status         (required) live | pending | withheld.
#                    live     → rendered with real HF data.
#                    pending  → renders a visible placeholder linking to provenance_url (no silent omission).
#                    withheld → entry present but not surfaced (e.g. data-correctness hold).
#   primary_config (required) the config (table) whose headline stat appears on the card.
#   tables         (required) one or more HF configs to render, each:
#       config           (required) HF dataset config (table) name.
#       label            (required) tab/section label on the detail page.
#       viz              (required) table | bar | line | map.
#       highlight_columns(required) columns shown first / used by the chart. Must exist in the table.
#   withheld_columns (optional) columns that must NEVER be surfaced (CI blocks them). See #971.
#   data_limits      (required) honest disclosure of coverage + known limitations.

version: 1

capabilities:
  - id: field-explorer
    title: World Energy Field Explorer
    domain: worldenergy
    summary: >-
      Global offshore field drill-down — fields, wells, and country rollups built
      from BSEE and public regulatory filings.
    hf_dataset: aceengineer/worldenergydata-explorer
    provenance_url: https://github.com/vamseeachanta/worldenergydata
    status: live
    primary_config: fields
    tables:
      - config: fields
        label: Fields
        viz: table
        highlight_columns: [name, operator, region, status, wells_count, api_gravity, cum_oil_mmbbl, avg_uptime_pct]
      - config: wells
        label: Wells
        viz: table
        highlight_columns: [api, field_id, cum_oil_mmbbl, uptime_pct, status]
      - config: countries
        label: Countries
        viz: bar
        highlight_columns: [country, fields, facilities]
    data_limits: >-
      Coverage is primarily US Gulf of Mexico deepwater (BSEE) plus selected
      international basins; not a complete global census. Published fields emphasize
      operational, geological, production, and provenance attributes. Economics are
      intentionally absent from this table while the upstream economics configuration
      is being republished and reviewed.

  - id: atlas-explorer
    title: Digital Model Parametric Atlases
    domain: digitalmodel
    summary: >-
      Standard-traceable parametric result grids — mooring fatigue (S-N), synthetic-rope
      fatigue (T-N), and riser code-check utilisation — from digitalmodel's validated
      reduced-order atlases.
    hf_dataset: aceengineer/digitalmodel-atlas-explorer
    provenance_url: https://github.com/vamseeachanta/digitalmodel
    status: live
    primary_config: mooring_fatigue
    tables:
      - config: mooring_fatigue
        label: Mooring Fatigue (DNV-RP-C203 S-N)
        viz: table
        highlight_columns: [sn_curve, stress_MPa, n_cycles, damage]
      - config: synthetic_rope_mooring_fatigue
        label: Synthetic Rope Fatigue (DNV-OS-E301 T-N)
        viz: table
        highlight_columns: [tension_range_kN, n_cycles, MBL_kN, damage]
      - config: code_check
        label: Riser Code Check (API-RP-2RD)
        viz: table
        highlight_columns: [outer_diameter, wall_thickness, effective_tension_kN, bending_moment_kNm, smys, utilisation]
    data_limits: >-
      Synthetic parametric sweeps generated from the cited standards (DNV-RP-C203,
      DNV-OS-E301, API-RP-2RD) and validated to under 10% max relative error against
      held-out samples. For screening and capability demonstration — not a substitute
      for a project-specific engineering check.

  - id: field-economics-sensitivity
    title: Field Economics Sensitivity
    domain: worldenergy
    summary: >-
      Field-economics sensitivity sweep — how life-to-date pretax NPV moves with WTI
      price and discount rate, on public BSEE production.
    hf_dataset: aceengineer/worldenergydata-explorer
    provenance_url: https://github.com/vamseeachanta/worldenergydata
    status: pending
    primary_config: parametric_economics
    tables:
      - config: parametric_economics
        label: Price × Discount-Rate Sweep
        viz: table
        highlight_columns: [field, wti_price_multiplier, discount_rate, npv_musd, breakeven_multiplier]
    data_limits: >-
      Life-to-date pretax NPV at various discount rates, computed on public BSEE
      production — a sensitivity to WTI price (via wti_price_multiplier) and discount
      rate, NOT full-cycle economics or forward projections. Because it reflects value
      realized to date, mature fields can show a negative life-to-date NPV. The basis
      travels with each value (economics_basis). A multi-dimensional field × price ×
      rate grid, honestly shown as a table rather than a single headline number.

  - id: dc-days-qaqc
    title: Field D&C Days QA/QC
    domain: worldenergy
    summary: >-
      Bore-by-bore drilling & completion days behind the World Oil April 2026
      reconciliation — 253 wellbores across 11 Gulf of Mexico developments,
      with drilling-day stability proven across data vintages. Browse the
      interactive drill-down: /capabilities/dc-drilldown.html
    hf_dataset: aceengineer/worldenergydata-explorer
    provenance_url: https://vamseeachanta.github.io/worldenergydata/wo-april-2026-qaqc-hub.html
    status: live
    # Interactive surfaces built from these same tables — listed on the card ahead
    # of the table view because they are the richer way into the data.
    experiences:
      - label: Drill-down (field ▸ block ▸ bore)
        url: /capabilities/dc-drilldown.html
      - label: QA/QC report hub
        url: /capabilities/dc-qaqc-hub.html
    primary_config: dc_development_summary
    tables:
      - config: dc_development_summary
        label: Reconciliation Matrix
        viz: table
        highlight_columns: [development, bores_wed, drilling_days, completion_days, dc_days_wed, dc_days_article, delta_days, status]
      - config: dc_bores
        label: Per-Well Listing
        viz: table
        max_rows: 300
        highlight_columns: [development, api12, spud, td_date, drilling_days, completion_days, dc_days, sidetrack, producer]
      - config: dc_vintage_diff
        label: Vintage Diff (Drilling Stability)
        viz: table
        max_rows: 300
        highlight_columns: [dev, api12, category, drill_v30, drill_wed, d_drill, d_compl]
    data_limits: >-
      Drilling days = spud to total depth; completion days = ALL post-TD rig time
      including later recompletion and servicing (the open worldenergydata#846
      boundary question). Known caveat: the extractor mixes calendar days (spans
      under ~250 d) with WAR-union rig-days (longer spans), so batch-drilled wells
      undercount drilling days — disclosed rather than corrected pending resolution.
      Producer markers cover the seven core Lower-Tertiary fields only.

  # Release-backed: the upstream dataset is private (CFD review artifacts), so this
  # capability is pinned to the immutable, content-addressed release this site publishes
  # rather than to live datasets-server configs. The digest/revision chain below is the
  # same one cited on the report pages and is checkable end to end.
  - id: tank-sloshing-cfd
    title: Tank Sloshing CFD
    domain: digitalmodel
    summary: >-
      OpenFOAM VOF sloshing analysis for partially filled tanks — free-decay validation
      against closed-form theory, a forced-roll period sweep, and the connected twin-tank
      U-tube exchange mode with its inter-tank mass shift and roll moment.
    backing: release
    hf_dataset: aceengineer/digitalmodel-sloshing
    provenance_url: https://www.aceengineer.com/reports/sloshing/validation.html
    status: live
    release:
      hub_url: /reports/sloshing/
      digest: a0da3df2d32f03e5dd7014dc81af6aeb6f332a8570738eecca4a3c62c6f9af97
      revision: aa37e6d365f3059674a49dc4bafbe4d64d12e5fd
      stats:
        - count: 24
          label: accepted cases
        - count: 89
          label: metrics
        - count: 9933
          label: response samples
    data_limits: >-
      Source-neutral reference geometry only — no vessel-specific dimensions are
      published here. Free-decay frequency matches closed-form theory to 0.30%; the
      conduit-area scaling law matches CFD to ~1-2%. Absolute forced magnitudes carry a
      single dynamic-amplification factor (x1.34 to x1.45) measured near resonance, and
      the connected-tank mass shift and roll moment are derived from the CFD-measured
      level difference rather than predicted independently.

  # ---- C1 wave 1 (aceengineer-website#97, digitalmodel#1646), published 2026-07-28 ----
  # Both datasets are tidy by construction: digitalmodel/scripts/hf/build_capability_datasets.py
  # unpivots the explorer sidecars (facet trees, square matrices) into one row per
  # observation. The explorer pages keep their own shape; these are the queryable form.

  - id: pipeline-wall-thickness
    title: Pipeline Wall Thickness — Six Codes Compared
    domain: digitalmodel
    summary: >-
      Wall-thickness screening for a reference pipe across six design codes — utilisation
      and the governing check at each thickness, so the codes are directly comparable.
    hf_dataset: aceengineer/digitalmodel-integrity
    provenance_url: https://vamseeachanta.github.io/digitalmodel/capabilities/api/wall-thickness-explorer.html
    status: live
    primary_config: wall_thickness
    tables:
      - config: wall_thickness
        label: Utilisation by code
        viz: line
        highlight_columns: [standard, wall_thickness_mm, utilisation, governing_check, safe]
    data_limits: >-
      Reference pipe geometry only (323.9 mm OD) — no client or project-specific data.
      One row per (code, wall thickness). Utilisation above 1.0 means the check is not
      satisfied at that thickness; those rows are retained deliberately, because the
      sweep exists to show where each code turns. The per-check columns are sparse by
      design — codes do not share a check set, so a null means the code defines no such
      check, not a missing value. Screening only, not a project design check.

  - id: corrosion-control
    title: Corrosion Control — Anode Sizing and Galvanic Compatibility
    domain: digitalmodel
    summary: >-
      Cathodic-protection anode sizing across structures, climates and coating conditions,
      plus galvanic compatibility for every metal pair in three exposure environments.
    hf_dataset: aceengineer/digitalmodel-corrosion
    provenance_url: https://vamseeachanta.github.io/digitalmodel/capabilities/api/cathodic-protection-explorer.html
    status: live
    primary_config: cathodic_protection
    tables:
      - config: cathodic_protection
        label: Anode sizing
        viz: table
        highlight_columns: [structure, climate, coating, design_life_years, anode_mass_kg, anode_count]
      - config: galvanic_compatibility
        label: Galvanic compatibility
        viz: table
        highlight_columns: [environment, metal_a, metal_b, verdict, delta_v, allowable_delta_v]
    data_limits: >-
      Reference geometries only (a 4-leg jacket and an XL monopile) — no client or
      vessel-specific data. Anode sizing follows DNV-RP-B401 across 2 structures x 2
      climates x 4 coating conditions x 7 design lives. Galvanic verdicts are anodic-index
      screening categories for all 16x16 metal pairs, including a metal against itself;
      they indicate where to look, and are not a substitute for a project-specific CP
      design. Environment allowable dV spans 0.15 V (harsh marine) to 0.5 V (controlled
      indoor).
