<!-- Google Analytics - deferred until after page is interactive.
     One copy for the whole site: head-common.html includes it, and
     scripts/build-drilldown.js inlines it into the two generated D&C pages. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-K31E51DQ47');
  (function() {
    function loadGtag() {
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-K31E51DQ47';
      document.head.appendChild(s);
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGtag);
    } else {
      window.addEventListener('load', loadGtag);
    }
  })();
</script>
