<!-- case-study-overview:start -->
<div data-case-study-overview>
    <section id="case-study-summary" aria-labelledby="case-study-summary-heading" data-case-study-summary>
        <h2 id="case-study-summary-heading">Summary of this analysis</h2>
        <p><strong>What was done:</strong> {{ what }}</p>
        <p><strong>Inputs:</strong> {{ inputs }}</p>
        <p><strong>Result:</strong> {{ result }}</p>
        <p><strong>Data basis:</strong> {{ basis }}</p>
    </section>
    <section aria-labelledby="case-study-report-heading" data-case-study-report>
        <h2 id="case-study-report-heading">Full report</h2>
        {{ report }}
    </section>
    <section aria-labelledby="case-study-repeat-heading" data-case-study-repeat>
        <h2 id="case-study-repeat-heading">How to repeat this analysis</h2>
        {{ workflow }}
    </section>
</div>
<!-- case-study-overview:end -->
