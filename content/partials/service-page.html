<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ service.heading }} | AceEngineer</title>
    <meta name="description" content="{{ service.receives }}">
    <meta property="og:title" content="{{ service.heading }} | AceEngineer">
    <meta property="og:description" content="{{ service.receives }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ canonicalUrl }}">
    <meta property="og:image" content="https://www.aceengineer.com/assets/img/logo.png">
    <script type="application/ld+json">
    [{"@context":"https://schema.org","@type":"WebPage","name":"{{ service.heading }} | AceEngineer","description":"{{ service.receives }}","url":"{{ canonicalUrl }}","inLanguage":"en","publisher":{"@id":"https://www.aceengineer.com/#organization"}},{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.aceengineer.com/"},{"@type":"ListItem","position":2,"name":"{{ service.heading }}","item":"{{ canonicalUrl }}"}]}]
    </script>
    <include src="partials/head-common.html"></include>
</head>
<body class="theme-page">
    <include src="partials/nav.html"></include>
    <main id="main" class="samples-page service-page">
        <section class="container">
            <h1>{{ service.heading }}</h1>
            <if condition="service.problem">
                <section data-problem><h2>The problem</h2><p>{{ service.problem }}</p></section>
            </if>
            <section data-deliverable>
                <h2>What you receive</h2>
                <p>{{ service.receives }}</p>
                <if condition="service.contents"><p>{{ service.contents }}</p></if>
            </section>
            <section data-method>
                <h2>Method and codes</h2>
                <p>{{ service.description }}</p>
                <if condition="service.codes.length">
                    <ul><each loop="citation in service.codes"><li>{{ citation }}</li></each></ul>
                </if>
            </section>
            <section data-sample>
                <h2>{{ copy.home.work.sample }}</h2>
                <include src="partials/service-samples.html"></include>
            </section>
            <include src="partials/scope-invitation.html"></include>
        </section>
    </main>
    <include src="partials/footer.html"></include>
</body>
</html>
